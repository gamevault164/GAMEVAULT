            if (apiResultsList.length === 0) {
                dom.apiResultsContainer.innerHTML = '<div class="p-4 text-sm text-slate-500 text-center">Nenhum resultado encontrado.</div>';
            } else {
                let html = '';
                apiResultsList.forEach((result, idx) => {
                    const coverThumbnail = result.covers && result.covers.length > 0
                        ? `<img src="${result.covers[0]}" class="w-10 h-14 object-contain bg-slate-950 p-0.5 rounded-md shadow-sm border border-slate-700" alt="Capa" loading="lazy" />`
                        : `<div class="w-10 h-14 bg-slate-900 border border-slate-700 rounded-md flex items-center justify-center"><i data-lucide="image" class="w-4 h-4 text-slate-600"></i></div>`;

                    html += `
                        <div onclick="window.selectApiResult(${idx}, this)" tabindex="0" class="px-4 py-3 hover:bg-slate-700/50 cursor-pointer flex justify-between items-center transition-colors group focus:bg-slate-700/50 focus:outline-none">
                            <div class="flex items-center gap-3">
                                ${coverThumbnail}
                                <span class="font-bold text-slate-200 text-sm uppercase group-hover:text-blue-400 transition-colors">${result.title}</span>
                            </div>
                            <span class="import-btn text-[10px] text-blue-400 font-bold bg-blue-500/10 border border-blue-500/20 px-3 py-1.5 rounded-full uppercase tracking-wider group-hover:bg-blue-500/20 transition-colors shrink-0">Importar</span>
                        </div>
                    `;
                });
                dom.apiResultsContainer.innerHTML = html;
                lucide.createIcons({ nameAttr: 'data-lucide', root: dom.apiResultsContainer });
            }
            dom.apiResultsContainer.classList.remove('hidden');
        }

        window.selectApiResult = function(index, element) {
            const result = apiResultsList[index];
            if(!result) return;

            dom.fTitle.value = result.title.toUpperCase();
            dom.fSynopsis.value = result.synopsis;
            
            formData_coverOptions = result.covers;
            formData_currentCoverIndex = 0;
            
            const selectedCover = result.covers[0] || '';
            dom.fCoverUrl.value = selectedCover;
            formData_covers[formData_activePlatformCover] = selectedCover;
            
            dom.btnTranslate.disabled = !result.synopsis;
            
            renderCoverPreview();
            
            // Feedback Visual de que foi importado (mantendo a lista aberta)
            if (element) {
                const btn = element.querySelector('.import-btn');
                if (btn) {
                    const originalText = btn.innerText;
                    btn.innerText = "Importado!";
                    btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/30');
                    btn.classList.remove('bg-blue-500/10', 'text-blue-400', 'border-blue-500/20');
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/30');
                        btn.classList.add('bg-blue-500/10', 'text-blue-400', 'border-blue-500/20');
                    }, 1500);
                }
            }
        }

        window.handleTranslate = async function() {
            const textToTranslate = dom.fSynopsis.value.trim();
            if (!textToTranslate) return;

            dom.btnTranslate.disabled = true;
            dom.translateNormal.classList.add('hidden');
            dom.translateSpin.classList.remove('hidden');

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(textToTranslate)}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data && data[0]) {
                    const translatedText = data[0].map(item => item[0]).join('');
                    dom.fSynopsis.value = translatedText;
                }
            } catch (err) {
                console.error("Erro na tradução", err);
                alert("Erro ao traduzir. A conexão pode ter falhado.");
            } finally {
                dom.btnTranslate.disabled = false;
                dom.translateNormal.classList.remove('hidden');
                dom.translateSpin.classList.add('hidden');
            }
        }

        // --- START APP ---
        init();
    </script>
</body>
</html>
