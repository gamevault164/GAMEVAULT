<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Gerenciador de Coleção</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Excel JS para exportação avançada -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    
    <!-- Firebase Clássico (Compat SDK) - Mais estável para HTML puro -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-database-compat.js"></script>

    <!-- Configuração de fonte base -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; color-scheme: dark; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ajuste de foco para navegação pelo teclado */
        .game-card:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59,130,246,0.3);
            border-color: #3b82f6;
            transform: translateY(-6px);
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-sans flex flex-col selection:bg-blue-500/30 overflow-y-scroll">

    <!-- HEADER NAVBAR PRINCIPAL -->
    <header class="sticky top-0 z-40 w-full backdrop-blur-lg bg-slate-900/80 border-b border-slate-800 shadow-sm transition-colors duration-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center shrink-0">
                <img src="https://raw.githubusercontent.com/Marcelo9035/IMAGES/refs/heads/main/Novo%20Projeto.png" 
                     alt="GameVault Logo" 
                     class="h-20 w-auto object-contain transition-all duration-300 cursor-pointer drop-shadow-[0_0_5px_rgba(59,130,246,0.4)] hover:brightness-150 hover:drop-shadow-[0_0_25px_rgba(59,130,246,1)] hover:scale-105" />
                <span class="font-bold text-2xl tracking-tight text-white hidden sm:block ml-4">GameVault</span>
            </div>

            <!-- Search Bar - Desktop -->
            <div class="hidden md:flex flex-1 max-w-xl relative group">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-blue-400 transition-colors"></i>
                <input type="text" id="search-desktop" placeholder="Pesquisar jogos na sua coleção..." class="w-full pl-10 pr-4 py-2 bg-slate-800/80 border border-slate-700 rounded-full text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-slate-800 transition-all" />
            </div>

            <!-- Actions (Apenas Adicionar Jogo) -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openNewGameModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 md:px-6 py-2.5 rounded-full text-sm font-bold transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_20px_rgba(59,130,246,0.5)] active:scale-95 whitespace-nowrap">
                    <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Jogo
                </button>
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-300 hover:bg-slate-800 rounded-full transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MOBILE SEARCH -->
    <div class="md:hidden px-4 py-3 bg-slate-900 border-b border-slate-800">
        <div class="relative group w-full">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-blue-400 transition-colors"></i>
            <input type="text" id="search-mobile" placeholder="Pesquisar..." class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all" />
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 flex flex-col md:flex-row gap-8 relative">
        
        <!-- SIDEBAR (Filtros de Plataforma) -->
        <aside id="sidebar-menu" class="md:w-56 shrink-0 hidden md:block transition-all">
            <div class="sticky top-24 space-y-6">
                <div>
                    <h3 class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-widest px-3">Biblioteca</h3>
                    <nav class="space-y-1">
                        <button onclick="setPlatformFilter('all')" id="filter-btn-all" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all text-sm font-medium bg-slate-800 text-blue-400 shadow-sm border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                            <i data-lucide="library" class="w-[18px] h-[18px] text-blue-400"></i>
                            Todos os Jogos
                            <span id="count-all" class="ml-auto bg-slate-900 text-slate-400 py-0.5 px-2 rounded-full text-xs">0</span>
                        </button>
                    </nav>
                </div>
                
                <div>
                    <h3 class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-widest px-3">Plataformas</h3>
                    <nav class="space-y-1" id="platforms-container">
                        <!-- Botões de plataforma gerados via JS -->
                    </nav>
                </div>
            </div>
        </aside>

        <!-- GAME GRID SECTION -->
        <section class="flex-1 w-full overflow-hidden">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="text-white font-bold text-lg flex items-center gap-2">
                    <span id="page-title">A Sua Coleção</span>
                </h2>
                <span class="text-xs font-medium bg-slate-900 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/20"><span id="display-count">0</span> jogos</span>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400 bg-slate-900/50 rounded-3xl border border-slate-800 border-dashed animate-fade-in">
                <div class="p-6 bg-slate-800/50 rounded-full mb-4">
                    <i data-lucide="library" class="w-12 h-12 text-slate-500"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-200 mb-2">Nenhum jogo encontrado</h2>
                <p class="text-slate-500 text-center max-w-sm mb-6">Parece que ainda não adicionou nenhum jogo para este filtro ou pesquisa.</p>
                <button onclick="openNewGameModal()" class="bg-blue-600 text-white font-medium hover:bg-blue-500 px-6 py-2.5 rounded-full transition-colors shadow-lg shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                    Adicionar um Jogo
                </button>
            </div>

            <!-- Games Grid -->
            <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 md:gap-6 w-full pb-8">
                <!-- Jogos renderizados via JS -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <p class="text-sm text-slate-500 font-medium">© <span id="current-year"></span> GameVault. PS5 UI Inspired Theme.</p>
            <div class="flex items-center gap-4 text-sm text-slate-400">
                <span id="firebase-status" class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)] inline-block animate-pulse"></span> Conectando Nuvem...</span>
            </div>
        </div>
    </footer>

    <!-- MODAL ADICIONAR / EDITAR -->
    <div id="game-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md items-center justify-center z-50 p-4 sm:p-6 hidden">
        <div class="bg-slate-900 rounded-3xl shadow-2xl shadow-black/50 w-full max-w-5xl max-h-full flex flex-col overflow-hidden border border-slate-700 transform transition-all animate-fade-in relative">
            
            <!-- Modal Header -->
            <div class="shrink-0 z-20 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                <h2 id="modal-title-text" class="text-xl md:text-2xl font-bold text-white flex items-center gap-3">
                    <div id="modal-title-icon-wrapper" class="p-2 rounded-xl shadow-sm bg-blue-500/20 text-blue-400 border border-blue-500/30">
                        <i id="modal-title-icon" data-lucide="plus" class="w-6 h-6"></i>
                    </div>
                    <span>Adicionar Novo Jogo</span>
                </h2>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-full transition-colors bg-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500/50">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Body (Rolável) -->
            <div class="flex-1 overflow-y-auto p-6 md:p-8 flex flex-col lg:flex-row gap-8 bg-slate-950/50">
                
                <!-- Coluna Esquerda: Capa e Status -->
                <div class="w-full lg:w-1/3 flex flex-col gap-6 shrink-0">
                    
                    <!-- Image Picker com Múltiplas Capas -->
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                <i data-lucide="image" class="w-4 h-4 text-blue-400"></i> Capa do Jogo
                            </p>
                        </div>
                        
                        <!-- TABS PARA MÚLTIPLAS CAPAS -->
                        <div id="modal-cover-tabs" class="flex flex-wrap gap-2 mb-3 hidden"></div>
                        
                        <div id="cover-preview-container" class="relative aspect-[3/4] bg-slate-950 rounded-xl border-2 border-dashed border-slate-700 mb-4 overflow-hidden flex items-center justify-center group transition-colors hover:border-blue-500">
                            <!-- Injetado por JS -->
                        </div>

                        <input type="url" id="form-cover-url" placeholder="https://exemplo.com/capa.jpg" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all" />
                    </div>

                    <!-- Emprestado Toggle -->
                    <div id="borrowed-card" class="bg-slate-900 border-slate-800 border rounded-2xl p-5 transition-all duration-300 shadow-sm">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div class="relative flex items-center justify-center shrink-0">
                                <input type="checkbox" id="form-is-borrowed" class="peer sr-only" />
                                <div class="w-12 h-7 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-500 transition-colors shadow-inner"></div>
                            </div>
                            <span id="borrowed-label" class="font-bold text-sm transition-colors text-slate-300">Este jogo está emprestado?</span>
                        </label>
                        
                        <div id="borrowed-to-container" class="mt-4 animate-fade-in space-y-2 hidden">
                            <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider">Para quem?</label>
                            <input type="text" id="form-borrowed-to" placeholder="Nome do amigo..." class="w-full px-4 py-3 bg-slate-950 border border-indigo-500/30 rounded-xl text-sm text-indigo-100 placeholder-indigo-300/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all font-semibold" />
                        </div>
                    </div>
                </div>

                <!-- Coluna Direita: Dados -->
                <div class="w-full lg:w-2/3 flex flex-col gap-6">
                    
                    <!-- Busca API DB -->
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-sm relative overflow-hidden shrink-0">
                        <div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none"><i data-lucide="library" class="w-24 h-24 text-white"></i></div>
                        
                        <label class="block text-xs font-bold text-blue-400 mb-3 uppercase tracking-wider flex items-center gap-2 relative z-10">
                            <i data-lucide="search" class="w-4 h-4"></i> Busca na Nuvem
                        </label>
                        <div class="flex flex-col sm:flex-row gap-3 relative z-10">
                            <select id="api-source-select" class="px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all font-bold shrink-0 cursor-pointer w-full sm:w-auto">
                                <option value="igdb">IGDB</option>
                                <option value="thegamesdb">TheGamesDB</option>
                            </select>
                            <input type="text" id="api-search-input" placeholder="Pesquise o nome oficial do jogo..." class="flex-1 px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-sm" />
                            <button id="btn-api-search" onclick="handleApiSearch()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] disabled:opacity-50 disabled:shadow-none flex items-center justify-center gap-2 shrink-0">
                                <span id="api-search-text">Procurar Capas</span>
                                <i id="api-search-loader" data-lucide="refresh-cw" class="w-[18px] h-[18px] animate-spin hidden"></i>
                            </button>
                        </div>

                        <!-- Lista de Resultados API -->
                        <div id="api-results-container" class="mt-4 max-h-64 overflow-y-auto bg-slate-800 border border-slate-700 rounded-xl shadow-inner divide-y divide-slate-700/50 relative z-10 hidden scrollbar-hide">
                            <!-- Resultados via JS -->
                        </div>
                    </div>

                    <!-- Formulário Principal -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-sm flex-1">
                        <div class="col-span-1 md:col-span-2 space-y-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Título do Jogo <span class="text-red-500">*</span></label>
                            <input type="text" id="form-title" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-base text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-bold uppercase" placeholder="Ex: God of War Ragnarök" />
                        </div>

                        <div class="col-span-1 md:col-span-2 space-y-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Plataformas Disponíveis</label>
                            <!-- Container para as Tags de Plataformas (Múltipla Seleção) -->
                            <div id="form-platforms-container" class="flex flex-wrap gap-2">
                                <!-- Botões gerados via JS -->
                            </div>
                        </div>

                        <div class="col-span-1 md:col-span-2 space-y-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Formato de Mídia</label>
                            <!-- Container para as Tags de Midia (Física/Digital) -->
                            <div id="form-medias-container" class="flex flex-wrap gap-2">
                                <!-- Botões gerados via JS -->
                            </div>
                        </div>

                        <div class="col-span-1 md:col-span-2 space-y-2">
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Idiomas (Áudio / Legendas)</label>
                            <!-- Container para as Tags de Idiomas (Múltipla Seleção) -->
                            <div id="form-languages-container" class="flex flex-wrap gap-2">
                                <!-- Botões gerados via JS -->
                            </div>
                        </div>

                        <div class="col-span-1 md:col-span-2 flex flex-col h-full mt-2">
                            <div class="flex justify-between items-center mb-3">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Sinopse</label>
                                <button id="btn-translate" onclick="handleTranslate()" class="text-[11px] text-blue-400 hover:text-blue-300 font-bold flex items-center gap-1.5 bg-blue-500/10 border border-blue-500/20 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg disabled:opacity-50 transition-colors tracking-wide focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                                    <i id="translate-icon-normal" data-lucide="languages" class="w-3.5 h-3.5"></i>
                                    <i id="translate-icon-spin" data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin hidden"></i>
                                    Traduzir para PT-BR
                                </button>
                            </div>
                            <textarea id="form-synopsis" class="w-full flex-1 min-h-[160px] px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-300 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all resize-none leading-relaxed font-medium" placeholder="Digite um resumo sobre o jogo..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="shrink-0 z-20 bg-slate-900 border-t border-slate-800 px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4 rounded-b-3xl">
                <button id="btn-delete" onclick="deleteGame()" class="w-full sm:w-auto text-red-400 hover:text-red-300 text-sm font-bold flex items-center justify-center gap-2 px-5 py-3 rounded-xl hover:bg-red-500/10 transition-colors hidden focus:outline-none focus:ring-2 focus:ring-red-500/50">
                    <i data-lucide="trash-2" class="w-[18px] h-[18px]"></i> Excluir da Biblioteca
                </button>
                <div id="btn-delete-placeholder" class="hidden sm:block"></div>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button onclick="closeModal()" class="w-full sm:w-auto px-6 py-3 border border-slate-700 text-slate-300 rounded-xl hover:bg-slate-800 text-sm font-bold transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500/50">
                        Cancelar
                    </button>
                    <button onclick="saveGame()" class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_20px_rgba(59,130,246,0.5)] active:scale-95 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                        <i data-lucide="save" class="w-[18px] h-[18px]"></i> Salvar Jogo
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ELEMENTOS ESCONDIDOS PARA FUNCIONAMENTO DO MENU NATIVO -->
    <input type="file" id="input-importar-txt" accept=".txt" class="hidden" onchange="window.importarBackupTXT(event)" />
    <input type="file" id="input-criar-html-menu" accept=".txt" class="hidden" onchange="window.gerarHTMLViewer(event)" />

    <!-- LOGIC SCRIPT -->
    <script>
        // Importa o sistema de arquivos direto no HTML (graças ao nodeIntegration)
        let fs = null;
        try {
            if (typeof require !== 'undefined') {
                fs = require('fs');
            }
        } catch (e) {
            console.warn("Ambiente Native/Node.js não detectado. As funções 'fs' não funcionarão na web comum.");
        }

        // --- FUNÇÕES GLOBAIS PARA SEREM CHAMADAS PELO SEU MENU NATIVO ---
        window.triggerExportarExcel = () => window.exportarPlanilhaSofisticada();
        window.triggerExportarTXT = () => window.exportarBackupTXT();
        window.triggerImportarTXT = () => document.getElementById('input-importar-txt').click();
        window.triggerCriarHTML = () => document.getElementById('input-criar-html-menu').click();

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyDY9kDIscb8vXrEfWIAQ09uK_jLp0RmHdU",
            authDomain: "gamedatabase-dae66.firebaseapp.com",
            databaseURL: "https://gamedatabase-dae66-default-rtdb.firebaseio.com",
            projectId: "gamedatabase-dae66",
            storageBucket: "gamedatabase-dae66.firebasestorage.app",
            messagingSenderId: "941291419161",
            appId: "1:941291419161:web:7191574bd59e1feb1c5c88"
        };

        let gamesRef = null;
        try {
            firebase.initializeApp(firebaseConfig);
            gamesRef = firebase.database().ref('games');
        } catch(e) {
            console.error("Falha ao iniciar o Firebase:", e);
        }

        // --- CONSTANTS ---
        const PLATFORMS = [
            { id: 'pc', name: 'PC', icon: 'monitor' },
            { id: 'ps1', name: 'PlayStation 1', icon: 'disc' },
            { id: 'ps2', name: 'PlayStation 2', icon: 'disc' },
            { id: 'ps3', name: 'PlayStation 3', icon: 'disc' },
            { id: 'ps4', name: 'PlayStation 4', icon: 'gamepad-2' },
            { id: 'ps5', name: 'PlayStation 5', icon: 'gamepad-2' },
            { id: 'psp', name: 'PSP', icon: 'gamepad-2' },
            { id: 'psvita', name: 'PS Vita', icon: 'gamepad-2' },
        ];

        const LANGUAGES = [
            { id: 'pt-br-audio', name: 'PT-BR (Áudio)', short: 'PT-BR (Á)' },
            { id: 'pt-br-leg', name: 'PT-BR (Leg)', short: 'PT-BR (L)' },
            { id: 'en-audio', name: 'EN (Áudio)', short: 'EN (Á)' },
            { id: 'en-leg', name: 'EN (Leg)', short: 'EN (L)' },
            { id: 'es-audio', name: 'ES (Áudio)', short: 'ES (Á)' },
            { id: 'es-leg', name: 'ES (Leg)', short: 'ES (L)' },
            { id: 'jp-audio', name: 'JP (Áudio)', short: 'JP (Á)' },
            { id: 'jp-leg', name: 'JP (Leg)', short: 'JP (L)' }
        ];

        const MEDIAS = [
            { id: 'fisica', name: 'Mídia Física', icon: 'disc' },
            { id: 'digital', name: 'Mídia Digital', icon: 'server' } 
        ];

        // --- STATE ---
        let games = []; 
        let filterPlatform = 'all';
        let searchQuery = '';
        let editingGameId = null;
        let isMobileMenuOpen = false;
        
        let formData_coverOptions = [];
        let formData_currentCoverIndex = 0;
        let formData_selectedPlatforms = []; 
        let formData_selectedLanguages = [];
        let formData_selectedMedias = [];

        // --- INITIALIZATION ---
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        function init() {
            setupEventListeners();
            
            const localData = localStorage.getItem('gameCollection');
            if (localData) {
                try {
                    let parsed = JSON.parse(localData);
                    if (typeof parsed === 'object' && !Array.isArray(parsed)) parsed = Object.values(parsed);
                    if (Array.isArray(parsed)) {
                        games = parsed.filter(g => g !== null);
                        updateSidebar();
                        renderGames();
                        lucide.createIcons();
                    }
                } catch (e) {
                    console.error("Dados locais corrompidos", e);
                }
            }
            
            if (gamesRef) {
                gamesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    
                    if (data !== null) { 
                        let safeGamesArray = Array.isArray(data) ? data : Object.values(data);
                        games = safeGamesArray.filter(g => g !== null && typeof g === 'object');
                        localStorage.setItem('gameCollection', JSON.stringify(games));
                    }
                    
                    dom.firebaseStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)] inline-block"></span> Nuvem Sincronizada`;
                    updateSidebar();
                    renderGames();
                    lucide.createIcons();
                }, (error) => {
                    console.warn("Nuvem bloqueada (verifique as Rules do Firebase)", error);
                    dom.firebaseStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] inline-block"></span> Nuvem Bloqueada`;
                });
            } else {
                dom.firebaseStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)] inline-block"></span> Armazenamento Local`;
            }
        }

        function saveToCloud(updatedGamesList) {
            localStorage.setItem('gameCollection', JSON.stringify(updatedGamesList));
            if (gamesRef) {
                gamesRef.set(updatedGamesList).catch(err => {
                    console.warn("O Firebase recusou a gravação. O dado foi mantido salvo localmente no seu dispositivo.");
                    dom.firebaseStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] inline-block"></span> Nuvem Bloqueada`;
                });
            }
        }

        // --- EVENT LISTENERS E KEYBOARD NAVIGATION ---
        function setupEventListeners() {
            const handleSearch = (e) => {
                searchQuery = e.target.value.toLowerCase();
                if(e.target.id === 'search-desktop') dom.searchMobile.value = searchQuery;
                else dom.searchDesktop.value = searchQuery;
                renderGames();
            };

            dom.searchDesktop.addEventListener('input', handleSearch);
            dom.searchMobile.addEventListener('input', handleSearch);

            dom.fIsBorrowed.addEventListener('change', (e) => {
                toggleBorrowedUI(e.target.checked);
            });

            dom.fCoverUrl.addEventListener('input', (e) => {
                formData_covers[formData_activePlatformCover] = e.target.value;
                renderCoverPreview();
            });
            
            dom.apiSearchInput.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') handleApiSearch();
            });

            dom.fSynopsis.addEventListener('input', () => {
                dom.btnTranslate.disabled = !dom.fSynopsis.value.trim();
            });

            document.addEventListener('keydown', (e) => {
                const isModalOpen = !dom.modal.classList.contains('hidden');

                // Atalho Criar HTML: Alt + C (ou Alt + H)
                if (e.altKey && (e.key.toLowerCase() === 'c' || e.key.toLowerCase() === 'h')) {
                    e.preventDefault();
                    window.triggerCriarHTML();
                    return;
                }

                if (e.key === 'Escape') {
                    if (isModalOpen) closeModal();
                    return;
                }

                if (isModalOpen) {
                    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON' && e.target.id !== 'api-search-input') {
                        e.preventDefault();
                        saveGame(); 
                    }
                    return;
                }

                const cards = Array.from(document.querySelectorAll('.game-card'));
                if (cards.length === 0) return;

                let activeIdx = cards.indexOf(document.activeElement);
                let colsCount = 1;
                for (let i = 1; i < cards.length; i++) {
                    if (cards[i].offsetTop > cards[0].offsetTop) { 
                        colsCount = i; 
                        break; 
                    }
                }

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    activeIdx = (activeIdx < cards.length - 1) ? activeIdx + 1 : 0;
                    cards[activeIdx].focus();
                } 
                else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    activeIdx = (activeIdx > 0) ? activeIdx - 1 : cards.length - 1;
                    cards[activeIdx].focus();
                }
                else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (activeIdx === -1) { cards[0].focus(); }
                    else {
                        let next = activeIdx + colsCount;
                        if (next < cards.length) cards[next].focus();
                        else cards[cards.length - 1].focus();
                    }
                }
                else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (activeIdx === -1) { cards[0].focus(); }
                    else {
                        let prev = activeIdx - colsCount;
                        if (prev >= 0) cards[prev].focus();
                        else cards[0].focus();
                    }
                }
                else if (e.key === 'Enter') {
                    if (activeIdx !== -1) {
                        e.preventDefault();
                        cards[activeIdx].click();
                    }
                }
            });
        }

                dom.borrowedLabel.classList.replace('text-red-400', 'text-slate-300');

            if (formData_selectedPlatforms.includes(id)) {
                formData_selectedPlatforms = formData_selectedPlatforms.filter(p => p !== id);
                if (formData_activePlatformCover === id) {
                    formData_activePlatformCover = formData_selectedPlatforms.length > 0 ? formData_selectedPlatforms[0] : 'default';
                }
            } else {
                formData_selectedPlatforms.push(id);
                if (formData_selectedPlatforms.length === 1 || formData_activePlatformCover === 'default') {

            renderPlatformToggles();
            renderModalCoverUI();
        }

            }

        window.cycleCover = function(direction) {
            if (!formData_coverOptions || formData_coverOptions.length === 0) return;
            formData_currentCoverIndex += direction;
            if (formData_currentCoverIndex >= formData_coverOptions.length) formData_currentCoverIndex = 0;
            if (formData_currentCoverIndex < 0) formData_currentCoverIndex = formData_coverOptions.length - 1;
            
            const newUrl = formData_coverOptions[formData_currentCoverIndex];
            dom.fCoverUrl.value = newUrl;
            formData_covers[formData_activePlatformCover] = newUrl;
            renderCoverPreview();
        }

        window.cycleCardCover = function(gameId, direction) {
            const img = document.getElementById(`card-cover-img-${gameId}`);
            if (!img) return;
            const covers = JSON.parse(decodeURIComponent(img.getAttribute('data-covers')));
            let idx = parseInt(img.getAttribute('data-index'), 10);
            idx += direction;
            if (idx >= covers.length) idx = 0;
            if (idx < 0) idx = covers.length - 1;
            img.setAttribute('data-index', idx);
            img.src = covers[idx];
        }

                const matchSearch = g.title.toLowerCase().includes(searchQuery);
                return matchPlatform && matchSearch;
            }).sort((a, b) => {
                return a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' });
            });

            dom.displayCount.textContent = filteredGames.length;

            if (filteredGames.length === 0) {
                dom.gamesGrid.innerHTML = '';
                dom.emptyState.classList.remove('hidden');
                dom.emptyState.classList.add('flex');

                dom.emptyState.classList.remove('flex');

                filteredGames.forEach(game => {
                    const gamePlats = game.platforms || (game.platform ? [game.platform] : []);

                        ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)] outline outline-2 outline-red-500/50' 
                        : 'outline-transparent border-slate-800 hover:border-blue-500/50 hover:shadow-[0_0_20px_rgba(59,130,246,0.15)]';

                                    specificPlatformCover = game.covers[p.id];
                                } else {
                                    validCovers.push(game.covers[p.id]);
                                }
                            }
                        });
                    }

                    if (specificPlatformCover) {
                        validCovers.unshift(specificPlatformCover);
                    }

                    if (validCovers.length === 0 && game.coverUrl) {
                        validCovers.push(game.coverUrl);
                    }
                    validCovers = [...new Set(validCovers)]; 
                    
                    const safeCoversStr = encodeURIComponent(JSON.stringify(validCovers));

                    const arrowsHtml = validCovers.length > 1 ? `
                        <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 flex justify-between px-2 opacity-0 group-hover:opacity-100 transition-opacity z-20 pointer-events-none">

                            <button type="button" onclick="event.stopPropagation(); window.cycleCardCover('${game.id}', 1)" class="pointer-events-auto p-1.5 bg-slate-900/90 text-white hover:bg-blue-500 rounded-full backdrop-blur-md transition-colors shadow-[0_0_10px_rgba(0,0,0,0.5)] focus:outline-none"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                    ` : '';

                    const coverInner = validCovers.length > 0
                        ? `<img id="card-cover-img-${game.id}" src="${validCovers[0]}" data-covers="${safeCoversStr}" data-index="0" alt="${game.title}" class="w-full h-full object-contain object-center backdrop-blur-2xl bg-slate-950 p-1 transform group-hover:scale-[1.03] transition-transform duration-700 ease-out" loading="lazy" />`
                        : `<div class="w-full h-full flex flex-col items-center justify-center text-slate-500 bg-slate-800/50"><i data-lucide="image" class="w-10 h-10 opacity-40 mb-2"></i><span class="text-xs font-medium uppercase tracking-wider">Sem Capa</span></div>`;

                    const borrowedBadge = game.isBorrowed 
                        ? `
                        <div class="absolute top-3 right-3 z-30">
                            <div class="flex items-center gap-2 bg-red-600 border border-red-500/50 backdrop-blur-md px-3 py-1.5 rounded-full text-[10px] font-bold text-white shadow-lg">

                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                                </span>
                                <span class="uppercase tracking-widest max-w-[90px] truncate">${game.borrowedTo}</span>
                            </div>
                        </div>` 
                        : '';

                    let badgesHtml = '';
                    let simpleIconsHtml = '';
                    gamePlats.forEach(pId => {
                        const pObj = PLATFORMS.find(p => p.id === pId);
                        if (pObj) {
                            badgesHtml += `
                                <div class="bg-slate-950/90 backdrop-blur-md text-slate-200 text-[10px] font-bold px-2 py-1.5 rounded-lg border border-slate-700 uppercase flex items-center gap-1 shadow-sm">
                                    <i data-lucide="${pObj.icon}" class="w-3 h-3 text-blue-400"></i>
                                    <span class="hidden sm:inline">${pObj.name}</span>
                                    <span class="sm:hidden">${pObj.id}</span>
                                </div>`;
                            simpleIconsHtml += `<i data-lucide="${pObj.icon}" class="w-4 h-4" title="${pObj.name}"></i>`;
                        }
                    });

                    let mediasHtml = '';
                    if (gameMedias.length > 0) {
                        mediasHtml = `<div class="absolute bottom-3 right-3 flex flex-col gap-1.5 z-20">`;
                        gameMedias.forEach(mId => {
                            const mObj = MEDIAS.find(m => m.id === mId);
                            if (mObj) {
                                let specificIcon = `<i data-lucide="${mObj.icon}" class="w-4 h-4 text-emerald-400"></i>`;
                                if (mId === 'digital') {
                                    specificIcon = `
                                    <svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                      <rect x="6" y="2" width="12" height="20" rx="2" ry="2"></rect>
                                      <line x1="12" y1="18" x2="12" y2="18.01"></line>
                                    </svg>`;
                                }
                                mediasHtml += `
                                <div class="bg-slate-900/90 backdrop-blur-md text-white p-1.5 rounded-full border border-slate-700 shadow-[0_0_10px_rgba(0,0,0,0.5)] flex items-center justify-center transform group-hover:scale-110 transition-transform" title="${mObj.name}">
                                    ${specificIcon}
                                </div>`;
                            }
                        });
                        mediasHtml += `</div>`;
                    }

                    let langsText = 'N/A';
                    if (Array.isArray(game.languages) && game.languages.length > 0) {
                        langsText = game.languages.map(lId => {
                            const langObj = LANGUAGES.find(l => l.id === lId);
                            return langObj ? langObj.short : lId;
                        }).join(', ');
                    } else if (typeof game.languages === 'string' && game.languages) {
                        langsText = game.languages; 
                    }

                    html += `
                        <div tabindex="0" onclick="window.openEditModal('${game.id}')" class="game-card group relative bg-slate-900 border rounded-2xl transition-all duration-300 flex flex-col overflow-hidden cursor-pointer hover:-translate-y-1.5 ${borderStyle}">
                            <div class="relative aspect-[3/4] bg-slate-950 w-full overflow-hidden flex items-center justify-center">
                                ${coverInner}
                                ${arrowsHtml}
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-900/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
                                ${borrowedBadge}
                                <div class="absolute bottom-3 left-3 right-12 flex flex-wrap gap-1.5 transform translate-y-2 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 z-20 pointer-events-none">
                                    ${badgesHtml}
                                </div>
                                ${mediasHtml}
                            </div>
                            <div class="p-4 flex flex-col flex-1 bg-slate-900 border-t border-slate-800 relative z-10">
                                <h3 class="font-bold text-slate-100 leading-tight mb-2 line-clamp-2 uppercase group-hover:text-blue-400 transition-colors" title="${game.title}">${game.title}</h3>
                                <div class="mt-auto flex items-center justify-between">
                                    <p class="text-[11px] text-slate-500 flex items-center gap-1.5 font-medium truncate pr-2" title="${langsText}">
                                        <i data-lucide="languages" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                        <span class="truncate max-w-[120px]">${langsText}</span>
                                    </p>
                                    <div class="text-slate-600 flex gap-1 group-hover:opacity-0 transition-opacity shrink-0">
                                        ${simpleIconsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                dom.gamesGrid.innerHTML = html;
                lucide.createIcons({ nameAttr: 'data-lucide', root: dom.gamesGrid });
            }
        }

        // --- CRUD / MODAL FUNCTIONS ---
        window.openNewGameModal = function() {
            editingGameId = null;
            
            dom.fTitle.value = '';
            formData_selectedPlatforms = ['ps4']; 
            formData_selectedLanguages = ['pt-br-audio', 'pt-br-leg']; 
            formData_selectedMedias = ['fisica'];
            formData_covers = {};
            formData_activePlatformCover = 'ps4';
            
            dom.fCoverUrl.value = '';
            dom.fSynopsis.value = '';
            dom.fIsBorrowed.checked = false;
            dom.fBorrowedTo.value = '';
            
            formData_coverOptions = [];
            formData_currentCoverIndex = 0;
            dom.apiSearchInput.value = '';
            dom.apiResultsContainer.innerHTML = '';
            dom.apiResultsContainer.classList.add('hidden');
            dom.btnTranslate.disabled = true;
            
            toggleBorrowedUI(false);
            renderPlatformToggles();
            renderLanguageToggles();
            renderMediaToggles();
            renderModalCoverUI();

            dom.modalTitleText.textContent = 'Adicionar Novo Jogo';
            dom.modalTitleIconWrapper.className = 'p-2 rounded-xl shadow-sm bg-blue-500/20 text-blue-400 border border-blue-500/30';
            dom.modalTitleIcon.setAttribute('data-lucide', 'plus');
            dom.btnDelete.classList.add('hidden');
            dom.btnDeletePlaceholder.classList.remove('hidden');

            dom.modal.classList.remove('hidden');
            dom.modal.classList.add('flex');
            
            setTimeout(() => dom.fTitle.focus(), 100);
            lucide.createIcons();
        }

        window.openEditModal = function(id) {
            const game = games.find(g => g.id === id);
            if(!game) return;

            editingGameId = id;

            dom.fTitle.value = game.title || '';
            formData_selectedPlatforms = game.platforms && game.platforms.length > 0 
                ? [...game.platforms] 
                : (game.platform ? [game.platform] : []);
                
            formData_covers = game.covers ? { ...game.covers } : {};
            if (game.coverUrl && Object.keys(formData_covers).length === 0) {
                const firstP = formData_selectedPlatforms.length > 0 ? formData_selectedPlatforms[0] : 'default';
                formData_covers[firstP] = game.coverUrl;
            }
            formData_activePlatformCover = formData_selectedPlatforms.length > 0 ? formData_selectedPlatforms[0] : 'default';
            
            if (Array.isArray(game.languages)) {
                formData_selectedLanguages = [...game.languages];
            } else if (typeof game.languages === 'string') {
                formData_selectedLanguages = [];
                const str = game.languages.toLowerCase();
                if (str.includes('português') || str.includes('pt-br')) {
                    formData_selectedLanguages.push('pt-br-audio', 'pt-br-leg');
                }
                if (str.includes('inglês') || str.includes('en')) {
                    formData_selectedLanguages.push('en-audio', 'en-leg');
                }
            } else {
                formData_selectedLanguages = [];
            }

            formData_selectedMedias = game.medias ? [...game.medias] : [];
            
            dom.fSynopsis.value = game.synopsis || '';
            dom.fIsBorrowed.checked = game.isBorrowed || false;
            dom.fBorrowedTo.value = game.borrowedTo || '';

            formData_coverOptions = [];
            formData_currentCoverIndex = 0;
            dom.apiSearchInput.value = '';
            dom.apiResultsContainer.innerHTML = '';
            dom.apiResultsContainer.classList.add('hidden');
            dom.btnTranslate.disabled = !game.synopsis;

            toggleBorrowedUI(game.isBorrowed);
            renderPlatformToggles();
            renderLanguageToggles();
            renderMediaToggles();
            renderModalCoverUI();

            dom.modalTitleText.textContent = 'Editar Jogo';
            dom.modalTitleIconWrapper.className = 'p-2 rounded-xl shadow-sm bg-amber-500/20 text-amber-400 border border-amber-500/30';
            dom.modalTitleIcon.setAttribute('data-lucide', 'edit-2');
            dom.btnDelete.classList.remove('hidden');
            dom.btnDeletePlaceholder.classList.add('hidden');

            dom.modal.classList.remove('hidden');
            dom.modal.classList.add('flex');
            
            setTimeout(() => dom.fTitle.focus(), 100);
            lucide.createIcons();
        }

        window.closeModal = function() {
            dom.modal.classList.add('hidden');
            dom.modal.classList.remove('flex');
        }

        window.saveGame = function() {
            const title = dom.fTitle.value.trim();
            if (!title) {
                alert("O título do jogo é obrigatório!");
                return;
            }
            if (formData_selectedPlatforms.length === 0) {
                alert("Selecione pelo menos uma plataforma!");
                return;
            }

            const gameData = {
                title: title.toUpperCase(), 
                platforms: formData_selectedPlatforms,
                covers: formData_covers,
                coverUrl: formData_covers[formData_selectedPlatforms[0]] || dom.fCoverUrl.value || '', 
                languages: formData_selectedLanguages,
                medias: formData_selectedMedias, 
                synopsis: dom.fSynopsis.value,
                isBorrowed: dom.fIsBorrowed.checked,
                borrowedTo: dom.fIsBorrowed.checked ? dom.fBorrowedTo.value : ''
            };

            if (!Array.isArray(games)) games = Object.values(games || {});
            
            let novaListaDeJogos = [...games];

            if (editingGameId) {
                gameData.id = editingGameId;
                const index = novaListaDeJogos.findIndex(g => g && g.id === editingGameId);
                if(index !== -1) novaListaDeJogos[index] = gameData;
            } else {
                gameData.id = Date.now().toString();
                novaListaDeJogos.push(gameData);
            }

            games = novaListaDeJogos;
            updateSidebar();
            renderGames();
            window.closeModal();

            saveToCloud(games); 
        }

        window.deleteGame = function() {
            if(!editingGameId) return;
            if (confirm("Tem certeza que deseja remover este jogo da biblioteca?")) {
                
                if (!Array.isArray(games)) games = Object.values(games || {});
                
                games = games.filter(g => g && g.id !== editingGameId);
                updateSidebar();
                renderGames();
                window.closeModal();

                saveToCloud(games); 
            }
        }

        // --- MANIPULAÇÃO DE ARQUIVOS ---
        window.exportarBackupTXT = function() {
            if (games.length === 0) return alert("Sua coleção está vazia!");
            const dadosTexto = JSON.stringify(games, null, 4);
            const blob = new Blob([dadosTexto], { type: 'text/plain;charset=utf-8' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `GameVault_Backup_${new Date().getTime()}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- IMPORTAR TXT E RESTAURAR COLEÇÃO ---
        window.importarBackupTXT = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        if (confirm(`Encontrados ${data.length} jogos no backup. Deseja importar esta coleção para a sua página principal?`)) {
                            games = data;
                            updateSidebar();
                            renderGames();
                            saveToCloud(games);
                            alert("Coleção restaurada com sucesso!");
                        }
                    } else {
                        alert("O arquivo não contém uma lista de jogos válida.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Erro ao ler o arquivo. Certifique-se de que é o arquivo TXT gerado pelo GameVault.");
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        // --- GERAR PÁGINA HTML ESTÁTICA COM MODAL INTERATIVO ---
        window.gerarHTMLViewer = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error("Formato inválido");
                    
                    // Escapar de forma segura para não corromper o script inline
                    const escapedData = JSON.stringify(data).replace(/</g, '\\u003c');
                    const platStr = JSON.stringify(PLATFORMS).replace(/</g, '\\u003c');
                    const medStr = JSON.stringify(MEDIAS).replace(/</g, '\\u003c');
                    const langStr = JSON.stringify(LANGUAGES).replace(/</g, '\\u003c');
                    
                    let htmlContent = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Coleção - GameVault Viewer</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/lucide@latest"><\/script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500/30">
    <!-- HEADER -->
    <header class="sticky top-0 z-40 w-full backdrop-blur-lg bg-slate-900/80 border-b border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-3">
                <i data-lucide="library" class="w-6 h-6 text-blue-500"></i> GameVault Viewer
            </h1>
            <span class="text-xs md:text-sm bg-slate-800 px-3 py-1.5 rounded-full text-blue-400 font-bold border border-blue-500/20" id="total-count">0 jogos</span>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 md:gap-6 w-full pb-8"></div>
    </main>

    <!-- MODAL DE VISUALIZAÇÃO -->
    <div id="view-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md items-center justify-center z-50 p-4 sm:p-6 hidden">
        <div class="bg-slate-900 rounded-3xl shadow-2xl w-full max-w-4xl max-h-full flex flex-col overflow-hidden border border-slate-700 animate-fade-in">
            <div class="shrink-0 z-20 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl md:text-2xl font-bold text-white flex items-center gap-3 uppercase"></h2>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors focus:outline-none"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 md:p-8 flex flex-col md:flex-row gap-8 bg-slate-950/50">
                <div class="w-full md:w-1/3 flex flex-col gap-4 shrink-0">
                    <img id="modal-cover" src="" class="w-full aspect-[3/4] object-contain object-center rounded-xl bg-slate-950 border border-slate-800 drop-shadow-2xl p-2" />
                    <div id="modal-borrowed" class="hidden bg-red-900/20 border border-red-800/50 p-4 rounded-xl shadow-inner">
                        <span class="text-xs font-bold text-red-400 uppercase tracking-wider block mb-1 flex items-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Emprestado para:</span>
                        <span id="modal-borrowed-to" class="font-bold text-slate-200"></span>
                    </div>
                </div>
                <div class="w-full md:w-2/3 flex flex-col gap-6">
                    <div>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-2"><i data-lucide="monitor" class="w-4 h-4"></i> Plataformas</span>
                        <div id="modal-platforms" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-2"><i data-lucide="disc" class="w-4 h-4"></i> Formatos de Mídia</span>
                        <div id="modal-medias" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-2"><i data-lucide="languages" class="w-4 h-4"></i> Idiomas</span>
                        <div id="modal-langs" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Sinopse</span>
                        <p id="modal-synopsis" class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap bg-slate-900 p-5 rounded-xl border border-slate-800 flex-1 min-h-[120px] shadow-inner"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIC SCRIPT EMBUTIDO -->
    <script>
        const games = ${escapedData};
        const PLATFORMS = ${platStr};
        const MEDIAS = ${medStr};
        const LANGUAGES = ${langStr};

        function init() {
            document.getElementById('total-count').textContent = games.length + ' jogos';
            
            const grid = document.getElementById('games-grid');
            let html = '';
            
            games.sort((a,b) => (a.title||'').localeCompare((b.title||''))).forEach(game => {
                const plats = game.platforms || (game.platform ? [game.platform] : []);
                let covers = [];
                
                // Puxar covers
                if (plats.length > 0) {
                    PLATFORMS.forEach(p => { 
                        if (plats.includes(p.id) && game.covers && game.covers[p.id]) covers.push(game.covers[p.id]); 
                    });
                }
                if (covers.length === 0 && game.coverUrl) covers.push(game.coverUrl);
                const displayCover = covers.length > 0 ? covers[0] : 'https://via.placeholder.com/300x400/0f172a/475569?text=Sem+Capa';
                
                const borderStyle = game.isBorrowed ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)] outline outline-2 outline-red-500/50' : 'border-slate-800 hover:border-blue-500/50 hover:shadow-[0_0_20px_rgba(59,130,246,0.15)]';
                const borrowedBadge = game.isBorrowed ? \`<div class="absolute top-2 right-2 z-10 flex items-center gap-2 bg-red-600 border border-red-500/50 px-2 py-1 rounded-full text-[9px] font-bold text-white"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> EMPRESTADO</div>\` : '';
                
                html += \`
                    <div onclick="openModal('\${game.id}')" class="game-card bg-slate-900 border rounded-2xl overflow-hidden cursor-pointer hover:-translate-y-1.5 transition-all flex flex-col group relative \${borderStyle}">
                        <div class="relative aspect-[3/4] bg-slate-950 flex items-center justify-center p-1">
                            \${borrowedBadge}
                            <img src="\${displayCover}" class="w-full h-full object-contain group-hover:scale-[1.03] transition-transform duration-700" loading="lazy" />
                        </div>
                        <div class="p-4 border-t border-slate-800 flex-1 flex flex-col">
                            <h3 class="font-bold text-slate-100 uppercase text-xs md:text-sm line-clamp-2 group-hover:text-blue-400 transition-colors" title="\${game.title}">\${game.title}</h3>
                        </div>
                    </div>\`;
            });
            grid.innerHTML = html;
            lucide.createIcons();
        }

        function openModal(id) {
            const game = games.find(g => g.id === id);
            if(!game) return;
            
            document.getElementById('modal-title').textContent = game.title;
            
            // Tratamento das Capas
            const plats = game.platforms || (game.platform ? [game.platform] : []);
            let covers = [];
            if (plats.length > 0) {
                PLATFORMS.forEach(p => { 
                    if (plats.includes(p.id) && game.covers && game.covers[p.id]) covers.push(game.covers[p.id]); 
                });
            }
            if (covers.length === 0 && game.coverUrl) covers.push(game.coverUrl);
            document.getElementById('modal-cover').src = covers.length > 0 ? covers[0] : 'https://via.placeholder.com/300x400/0f172a/475569?text=Sem+Capa';
            
            // Tratar Empréstimo
            if(game.isBorrowed) {
                document.getElementById('modal-borrowed').classList.remove('hidden');
                document.getElementById('modal-borrowed-to').textContent = game.borrowedTo || 'Amigo (Não Específicado)';
            } else {
                document.getElementById('modal-borrowed').classList.add('hidden');
            }
            
            // Preencher Plataformas
            let platHtml = '';
            plats.forEach(pId => {
                const pObj = PLATFORMS.find(p => p.id === pId);
                if(pObj) platHtml += \`<span class="bg-blue-600 border border-blue-500 text-white shadow-md px-3 py-1.5 rounded-lg text-xs font-bold uppercase flex items-center gap-1.5"><i data-lucide="\${pObj.icon}" class="w-3.5 h-3.5"></i> \${pObj.name}</span>\`;
            });
            document.getElementById('modal-platforms').innerHTML = platHtml || '<span class="text-slate-500 text-sm font-medium">Nenhuma informada</span>';

            // Preencher Mídias
            let medHtml = '';
            (game.medias||[]).forEach(mId => {
                const mObj = MEDIAS.find(m => m.id === mId);
                if(mObj) medHtml += \`<span class="bg-emerald-600 border border-emerald-500 text-white shadow-md px-3 py-1.5 rounded-lg text-xs font-bold uppercase flex items-center gap-1.5">\${mObj.name}</span>\`;
            });
            document.getElementById('modal-medias').innerHTML = medHtml || '<span class="text-slate-500 text-sm font-medium">Nenhuma informada</span>';
            
            // Preencher Idiomas
            let langHtml = '';
            let langs = Array.isArray(game.languages) ? game.languages : [];
            langs.forEach(lId => {
                const lObj = LANGUAGES.find(l => l.id === lId);
                if(lObj) langHtml += \`<span class="bg-indigo-600 border border-indigo-500 text-white shadow-md px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider">\${lObj.name}</span>\`;
            });
            if(typeof game.languages === 'string' && game.languages) langHtml = \`<span class="text-sm font-bold text-indigo-400">\${game.languages}</span>\`;
            document.getElementById('modal-langs').innerHTML = langHtml || '<span class="text-slate-500 text-sm font-medium">Nenhuma informada</span>';
            
            // Sinopse
            document.getElementById('modal-synopsis').textContent = game.synopsis || 'Nenhuma sinopse disponível.';
            
            // Abre o Modal
            const modal = document.getElementById('view-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('view-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Fecha modal apertando ESC
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') closeModal();
        });

        init();
    <\/script>
</body>
</html>`;

        function openModal(id) {

            const plats = game.platforms || (game.platform ? [game.platform] : []);

                });

            document.getElementById('modal-cover').src = covers.length > 0 ? covers[0] : 'https://via.placeholder.com/300x400/0f172a/475569?text=Sem+Capa';

                document.getElementById('modal-borrowed').classList.remove('hidden');

            } else {
                document.getElementById('modal-borrowed').classList.add('hidden');

            // Popula Plataformas

            // Popula Idiomas

        // --- EXPORTAÇÃO SOFISTICADA PARA EXCEL ---
        window.exportarPlanilhaSofisticada = async function() {
            if (games.length === 0) return alert("Sua coleção está vazia!");

            // Inicia o Workbook
            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'GameVault App';
            workbook.created = new Date();

            // ==========================================
            // ABA 1: DASHBOARD (RESUMO)
            // ==========================================
            const sheetResumo = workbook.addWorksheet('📊 Dashboard', { properties: { tabColor: { argb: 'FF0ea5e9' } } });
            
            // Título Principal
            sheetResumo.mergeCells('A1:C2');
            const titleCell = sheetResumo.getCell('A1');
            titleCell.value = 'Relatório Geral - GameVault';
            titleCell.font = { name: 'Arial', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
            titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0f172a' } };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

            // Estatísticas Básicas
            const totalEmprestados = games.filter(g => g.isBorrowed).length;
            const plataformasUnicas = [...new Set(games.flatMap(g => g.platforms || (g.platform ? [g.platform] : [])))];

            sheetResumo.getColumn('A').width = 25;
            sheetResumo.getColumn('B').width = 15;

            sheetResumo.getCell('A4').value = 'MÉTRICAS DA COLEÇÃO';
            sheetResumo.getCell('A4').font = { bold: true, color: { argb: 'FF0ea5e9' } };
            
            sheetResumo.addRow(['Total de Jogos', games.length]);
            sheetResumo.addRow(['Jogos Emprestados', totalEmprestados]);
            sheetResumo.addRow(['Plataformas Diferentes', plataformasUnicas.length]);
            sheetResumo.addRow(['Data de Exportação', new Date().toLocaleDateString('pt-BR')]);

            // Estilizando as linhas de métricas
            for(let i = 5; i <= 8; i++) {
                sheetResumo.getCell(`A${i}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };
                sheetResumo.getCell(`A${i}`).border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } } };
                sheetResumo.getCell(`B${i}`).font = { bold: true };
                sheetResumo.getCell(`B${i}`).alignment = { horizontal: 'center' };
                sheetResumo.getCell(`B${i}`).border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } } };
            }

            // ==========================================
            // ABA 2: BANCO DE DADOS (COLEÇÃO)
            // ==========================================
            const sheetDados = workbook.addWorksheet('🎮 Banco de Dados', { properties: { tabColor: { argb: 'FF10b981' } } });

            // Cabeçalhos
            sheetDados.columns = [
                { header: 'Título do Jogo', key: 'title', width: 40 },
                { header: 'Plataformas', key: 'platforms', width: 25 },
                { header: 'Mídias', key: 'medias', width: 20 },
                { header: 'Status', key: 'status', width: 15 },
                { header: 'Emprestado Para', key: 'borrowedTo', width: 25 }
            ];

            // Estilizando o Cabeçalho
            const headerRow = sheetDados.getRow(1);
            headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } };
            headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
            headerRow.height = 25;

            // Filtro Automático (Setinhas no Excel)
            sheetDados.autoFilter = 'A1:E1';

            // Preenchendo os dados
            let safeGames = [...games].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            safeGames.forEach((g, index) => {
                // Recuperação segura para garantir que jogos com estrutura antiga não partam o script
                const plats = (g.platforms && g.platforms.length > 0 ? g.platforms : (g.platform ? [g.platform] : [])).map(p => p.toUpperCase()).join(', ');
                const meds = (g.medias || []).map(m => m.toUpperCase()).join(', ');
                const statusStr = g.isBorrowed ? '🔴 Emprestado' : '🟢 Na Coleção';
                
                const row = sheetDados.addRow({
                    title: g.title,
                    platforms: plats,
                    medias: meds,
                    status: statusStr,
                    borrowedTo: g.isBorrowed ? g.borrowedTo : '-'
                });

                // Zebrando as linhas para visual profissional
                if (index % 2 === 0) {
                    row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
                }
                
                // Centralizando colunas específicas
                row.getCell('status').alignment = { horizontal: 'center' };
                if (g.isBorrowed) row.getCell('status').font = { color: { argb: 'FFDC2626' }, bold: true };
            });

            // Geração e Download do Arquivo
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `GameVault_Colecao_${new Date().getTime()}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- API FUNCTIONS ---
        window.handleApiSearch = async function() {
            const query = dom.apiSearchInput.value.trim();
            if (!query) return;

            dom.btnApiSearch.disabled = true;
            dom.apiSearchText.classList.add('hidden');
            dom.apiSearchLoader.classList.remove('hidden');

            try {
                const source = dom.apiSourceSelect.value;
                
                if (source === 'igdb') {
                    const CLIENT_ID = 'ui07l07p7gy1wsfcjhueuxjiixiwnq';
                    const CLIENT_SECRET = 'tih38jsxi47bxo2056jg6ho65xge7y';
                    
                    const tokenUrl = `https://id.twitch.tv/oauth2/token?client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&grant_type=client_credentials`;
                    const proxyTokenUrl = `https://corsproxy.io/?${encodeURIComponent(tokenUrl)}`;
                    
                    const tokenRes = await fetch(proxyTokenUrl, { method: 'POST' });
                    if (!tokenRes.ok) throw new Error("Erro token Twitch");
                    
                    const tokenData = await tokenRes.json();
                    const accessToken = tokenData.access_token;
                    
                    const targetUrl = 'https://api.igdb.com/v4/games';
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    
                    const safeQuery = query.replace(/"/g, '');
                    const queryBody = `search "${safeQuery}"; fields name, cover.image_id, screenshots.image_id, summary; limit 15;`;

                    const igdbRes = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Client-ID': CLIENT_ID,
                            'Authorization': `Bearer ${accessToken}`,
                        },
                        body: queryBody
                    });

                    if (!igdbRes.ok) throw new Error("Erro IGDB");
                    const data = await igdbRes.json();
                    
                    apiResultsList = data.map(game => {
                        const covers = [];
                        if (game.cover && game.cover.image_id) {
                            covers.push(`https://images.igdb.com/igdb/image/upload/t_1080p/${game.cover.image_id}.jpg`);
                        }
                        if (game.screenshots && game.screenshots.length > 0) {
                            game.screenshots.forEach(sc => {
                                covers.push(`https://images.igdb.com/igdb/image/upload/t_1080p/${sc.image_id}.jpg`);
                            });
                        }

                        return {
                            title: game.name,
                            covers: covers,
                            synopsis: game.summary || "Sem sinopse disponível."
                        };
                    });
                } else if (source === 'thegamesdb') {
                    const THEGAMESDB_API_KEY = "9ff2c491e42cd10e2aad3c1d81e357a3081d5b059cc3b7915ba6c470a7b70c9f";
                    const targetUrl = `https://api.thegamesdb.net/v1/Games/ByGameName?name=${encodeURIComponent(query)}&apikey=${THEGAMESDB_API_KEY}&fields=overview`;
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error("Erro TheGamesDB");
                    const data = await res.json();
                    
                    if (!data.data || !data.data.games || data.data.games.length === 0) {
                        apiResultsList = [];
                    } else {
                        const gamesData = data.data.games.slice(0, 15);
                        const gameIds = gamesData.map(g => g.id).join(',');
                        
                        const imgUrl = `https://api.thegamesdb.net/v1/Games/Images?games_id=${gameIds}&filter[type]=boxart&apikey=${THEGAMESDB_API_KEY}`;
                        const imgProxyUrl = `https://corsproxy.io/?${encodeURIComponent(imgUrl)}`;
                        let imagesMap = {};
                        let baseUrl = 'https://cdn.thegamesdb.net/images/original/';
                        
                        try {
                            const imgRes = await fetch(imgProxyUrl);
                            if(imgRes.ok) {
                                const imgData = await imgRes.json();
                                if(imgData.data && imgData.data.base_url && imgData.data.base_url.original) {
                                    baseUrl = imgData.data.base_url.original;
                                }
                                if(imgData.data && imgData.data.images) {
                                    Object.keys(imgData.data.images).forEach(gId => {
                                        const imgs = imgData.data.images[gId];
                                        const frontCovers = imgs.filter(i => i.side === 'front');
                                        imagesMap[gId] = (frontCovers.length > 0 ? frontCovers : imgs).map(i => baseUrl + i.filename);
                                    });
                                }
                            }
                        } catch(e) {
                            console.warn("Não foi possível buscar imagens da TheGamesDB", e);
                        }
                        
                        apiResultsList = gamesData.map(game => {
                            const covers = imagesMap[game.id] || [];
                            return {
                                title: game.game_title,
                                covers: covers,
                                synopsis: game.overview || "Sem sinopse disponível."
                            };
                        });
                    }
                }

                renderApiResults();

            } catch (error) {
                console.error("API Error:", error);
                alert("Erro ao conectar com a API de busca. Verifique o console.");
            } finally {
                dom.btnApiSearch.disabled = false;
                dom.apiSearchText.classList.remove('hidden');
                dom.apiSearchLoader.classList.add('hidden');
            }
        }
